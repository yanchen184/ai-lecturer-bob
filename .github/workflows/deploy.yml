name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
  repository_dispatch:
    types: [firestore-updated]
  schedule:
    # 每天台北時間 09:00 自動 build（UTC 01:00），讓當天 publishDate 的 K8s 文章上線
    - cron: '0 1 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Kroki self-host：build 時用 localhost:8000 渲染所有 ```kroki:* code block
    # 並把 SVG inline 進 HTML，部署後讀者不需要連 kroki.io（公服務常掛）。
    # 注意：mermaid 引擎要拆成獨立 container 跑（headless browser），
    # 透過 docker network alias 在 services 之間連線。
    services:
      kroki-mermaid:
        image: yuzutech/kroki-mermaid
      kroki:
        image: yuzutech/kroki
        ports:
          - 8000:8000
        env:
          KROKI_MERMAID_HOST: kroki-mermaid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Wait for Kroki
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ -o /dev/null; then
              echo "Kroki is ready"; exit 0
            fi
            sleep 2
          done
          echo "Kroki failed to start"; exit 1
      - run: npm run build
        env:
          PUBLIC_SITE_URL: https://yanchen184.github.io
          PUBLIC_BASE: /ai-lecturer-bob
          KROKI_ENDPOINT: http://localhost:8000
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
