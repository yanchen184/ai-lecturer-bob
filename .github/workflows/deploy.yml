name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
  repository_dispatch:
    types: [firestore-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: astro-site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_SITE_URL: https://yanchen184.github.io
          PUBLIC_BASE: /ai-lecturer-bob
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./astro-site/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
