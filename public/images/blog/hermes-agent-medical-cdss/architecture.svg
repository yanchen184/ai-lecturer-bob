<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" style="background:#0b1020;border-radius:8px;font-family:-apple-system,'Segoe UI',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/></marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#fafafa">Hermes Agent 醫療 CDSS 架構</text>
  <text x="400" y="50" text-anchor="middle" font-size="11" fill="#94a3b8">(已通用化:port / 服務名 / PDF 名全部替換)</text>
  <rect x="320" y="75" width="160" height="50" rx="6" fill="#1e293b" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="400" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#fafafa">clinical-web (React)</text>
  <text x="400" y="116" text-anchor="middle" font-size="11" fill="#94a3b8">醫師覆核 UI</text>
  <line x1="400" y1="125" x2="400" y2="150" stroke="#7dd3fc" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="290" y="155" width="220" height="50" rx="6" fill="#1e293b" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="400" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#fafafa">clinical-api (Spring Boot :8080)</text>
  <text x="400" y="194" text-anchor="middle" font-size="11" fill="#94a3b8">PatientState 序列化 + 權限</text>
  <line x1="400" y1="205" x2="400" y2="230" stroke="#7dd3fc" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="180" y="235" width="440" height="135" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <text x="400" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#fbbf24">ai-service router (FastAPI :8090)</text>
  <rect x="200" y="275" width="120" height="40" rx="4" fill="#1e293b" stroke="#a78bfa"/>
  <text x="260" y="293" text-anchor="middle" font-size="11" font-weight="600" fill="#fafafa">HermesAnalyzer</text>
  <text x="260" y="307" text-anchor="middle" font-size="10" fill="#94a3b8">prompt builder</text>
  <rect x="340" y="275" width="120" height="40" rx="4" fill="#1e293b" stroke="#a78bfa"/>
  <text x="400" y="293" text-anchor="middle" font-size="11" font-weight="600" fill="#fafafa">hermes -z subprocess</text>
  <text x="400" y="307" text-anchor="middle" font-size="10" fill="#94a3b8">LLM 自編排 tools</text>
  <rect x="480" y="275" width="120" height="40" rx="4" fill="#1e293b" stroke="#a78bfa"/>
  <text x="540" y="293" text-anchor="middle" font-size="11" font-weight="600" fill="#fafafa">validator + adapter</text>
  <text x="540" y="307" text-anchor="middle" font-size="10" fill="#94a3b8">schema 守門</text>
  <rect x="200" y="325" width="400" height="35" rx="4" fill="#1e293b" stroke="#34d399"/>
  <text x="400" y="346" text-anchor="middle" font-size="11" fill="#fafafa">JSONL session trace(每 tool call 寫一行,出事可 replay)</text>
  <line x1="260" y1="370" x2="170" y2="400" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="400" y1="370" x2="400" y2="400" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="540" y1="370" x2="630" y2="400" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="40" y="405" width="240" height="55" rx="6" fill="#1e293b" stroke="#a78bfa"/>
  <text x="160" y="425" text-anchor="middle" font-size="12" font-weight="600" fill="#fafafa">skills/lipid-secondary/SKILL.md</text>
  <text x="160" y="442" text-anchor="middle" font-size="10" fill="#94a3b8">knowledge + policy 兩層 schema</text>
  <text x="160" y="455" text-anchor="middle" font-size="10" fill="#94a3b8">via skill_view(name)</text>
  <rect x="290" y="405" width="220" height="55" rx="6" fill="#1e293b" stroke="#a78bfa"/>
  <text x="400" y="425" text-anchor="middle" font-size="12" font-weight="600" fill="#fafafa">formulas/lipid/ (sandbox)</text>
  <text x="400" y="442" text-anchor="middle" font-size="10" fill="#94a3b8">deterministic 算法</text>
  <text x="400" y="455" text-anchor="middle" font-size="10" fill="#94a3b8">via execute_code()</text>
  <rect x="520" y="405" width="240" height="55" rx="6" fill="#1e293b" stroke="#a78bfa"/>
  <text x="640" y="425" text-anchor="middle" font-size="12" font-weight="600" fill="#fafafa">rag-server (MCP, pgvector :5432)</text>
  <text x="640" y="442" text-anchor="middle" font-size="10" fill="#94a3b8">bge-m3 1024d HNSW</text>
  <text x="640" y="455" text-anchor="middle" font-size="10" fill="#94a3b8">via mcp_rag_search()</text>
</svg>
